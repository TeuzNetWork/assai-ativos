<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TI - Assaí Atacadista | Gestão de Ativos</title>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <header class="bg-amber-500 text-slate-900 p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">ASSAÍ ATACADISTA</h1>
        <p class="text-xs font-semibold opacity-80">Painel de Controle de Ativos - TI</p>
      </div>
      <div class="flex gap-2">
        <button id="btnAbrirSetores" class="bg-slate-800 text-amber-400 hover:bg-slate-900 font-bold px-3 py-2 rounded-lg shadow transition text-sm">
          ⚙️ Setores
        </button>
        <button id="btnAbrirModal" class="bg-slate-900 text-white hover:bg-slate-800 font-bold px-4 py-2 rounded-lg shadow transition text-sm">
          + Cadastrar Equipamento
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-4">
      <input type="text" id="campoBusca" placeholder="Buscar por Nome, IP, Modelo ou Setor..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      <select id="filtroSetor" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <option value="">Todos os Setores</option>
      </select>
    </div>

    <div id="gridEquipamentos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- Modal Cadastro Equipamento -->
  <div id="modalCadastro" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h2 class="text-xl font-bold text-slate-900">Novo Equipamento</h2>
      
      <form id="formEquipamento" class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-600 uppercase">Identificador / Nome</label>
          <input type="text" id="cadNome" placeholder="Ex: BAL-AC-01" required class="w-full border border-slate-300 rounded p-2 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-slate-600 uppercase">Setor</label>
            <select id="cadSetor" required class="w-full border border-slate-300 rounded p-2 text-sm"></select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 uppercase">Tipo</label>
            <select id="cadTipo" required class="w-full border border-slate-300 rounded p-2 text-sm">
              <option value="Balança">Balança</option>
              <option value="Impressora Cartazista">Impressora Cartazista</option>
              <option value="Micro Terminal / PDV">Micro Terminal / PDV</option>
              <option value="Switch / Rede">Switch / Rede</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-slate-600 uppercase">Endereço IP</label>
            <input type="text" id="cadIp" placeholder="Ex: 192.168.1.50" required class="w-full border border-slate-300 rounded p-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 uppercase">Marca / Modelo</label>
            <input type="text" id="cadModelo" placeholder="Ex: Toledo Prix 5" required class="w-full border border-slate-300 rounded p-2 text-sm">
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-600 uppercase">Ponto de Rede / Local</label>
          <input type="text" id="cadLocal" placeholder="Ex: Ponto A-12 / Ao lado da câmara fria" class="w-full border border-slate-300 rounded p-2 text-sm">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnFecharCadastro" class="px-4 py-2 text-sm bg-slate-200 rounded hover:bg-slate-300 font-semibold">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-amber-500 text-slate-900 rounded font-bold hover:bg-amber-400">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Gerenciar Setores -->
  <div id="modalSetores" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h2 class="text-xl font-bold text-slate-900">Gerenciar Setores</h2>
      
      <form id="formSetor" class="flex gap-2">
        <input type="hidden" id="setorEditIdx" value="-1">
        <input type="text" id="inputSetorNome" placeholder="Novo setor..." required class="flex-1 border border-slate-300 rounded p-2 text-sm">
        <button type="submit" id="btnSalvarSetor" class="px-4 py-2 text-sm bg-amber-500 text-slate-900 rounded font-bold hover:bg-amber-400">Adicionar</button>
      </form>

      <div class="border rounded-lg max-h-52 overflow-y-auto divide-y divide-slate-100">
        <ul id="listaSetores"></ul>
      </div>

      <div class="flex justify-end pt-2">
        <button type="button" id="btnFecharSetores" class="px-4 py-2 text-sm bg-slate-200 text-slate-800 rounded font-semibold hover:bg-slate-300">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal QR Code / Etiqueta -->
  <div id="modalQrCode" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center space-y-4">
      <h3 class="text-lg font-bold text-slate-900">Etiqueta com QR Code</h3>
      
      <div id="etiquetaParaImpressao" class="border-2 border-dashed border-slate-400 p-4 rounded-lg bg-slate-50 flex flex-col items-center gap-2">
        <p class="text-xs font-extrabold tracking-wider text-slate-700">ASSAÍ ATACADISTA - TI</p>
        <canvas id="canvasQrCode" class="p-2 bg-white rounded border"></canvas>
        <p id="qrNome" class="font-bold text-slate-900 text-sm"></p>
        <p id="qrIp" class="text-xs font-mono bg-slate-200 px-2 py-0.5 rounded"></p>
        <p id="qrModelo" class="text-[11px] text-slate-600"></p>
      </div>

      <div class="flex justify-center gap-2">
        <button id="btnImprimir" class="px-4 py-2 bg-slate-900 text-white rounded text-sm font-bold hover:bg-slate-800">🖨️ Imprimir Etiqueta</button>
        <button id="btnFecharQrCode" class="px-4 py-2 bg-slate-200 text-slate-800 rounded text-sm font-semibold hover:bg-slate-300">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal Detalhes do Ativo -->
  <div id="modalDetalhes" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
      <div class="bg-amber-500 p-4 text-slate-900 flex justify-between items-center">
        <div>
          <span class="text-[10px] uppercase tracking-widest font-extrabold opacity-80">Ficha Técnica de TI</span>
          <h2 id="detalheId" class="text-xl font-black"></h2>
        </div>
        <span id="detalheSetor" class="bg-slate-900 text-amber-400 text-xs font-bold px-3 py-1 rounded-full"></span>
      </div>
      
      <div class="p-6 space-y-4 text-left">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-2">
          <div class="flex justify-between items-center border-b border-slate-200 pb-2">
            <span class="text-xs font-semibold text-slate-500">Endereço IP</span>
            <span id="detalheIp" class="font-mono text-sm font-bold text-slate-900 bg-amber-100 px-2 py-0.5 rounded"></span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-200 pb-2">
            <span class="text-xs font-semibold text-slate-500">Tipo</span>
            <span id="detalheTipo" class="text-xs font-medium text-slate-800"></span>
          </div>
          <div class="flex justify-between items-center border-b border-slate-200 pb-2">
            <span class="text-xs font-semibold text-slate-500">Modelo</span>
            <span id="detalheModelo" class="text-xs font-medium text-slate-800"></span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-slate-500">Localização</span>
            <span id="detalheLocal" class="text-xs font-medium text-slate-800"></span>
          </div>
        </div>

        <div class="pt-2 flex justify-end">
          <button id="btnFecharDetalhes" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl transition text-sm">
            Fechar Ficha
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
